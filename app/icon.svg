<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Waleed Iqbal">
  <!--
    Initials on a dark tile. Explicit fills, not currentColor: a favicon is
    rendered outside the page, so it cannot inherit the theme.
  -->
  <rect width="32" height="32" rx="7" fill="#0b1220"/>
  <text x="16" y="21.5" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="15" font-weight="600" fill="#e2e8f0" letter-spacing="-0.5">WI</text>
</svg>
